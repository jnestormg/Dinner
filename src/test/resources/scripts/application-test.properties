# ===============================
# DATASOURCE - ORACLE
# ===============================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=system
spring.datasource.password=abraxas
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Desactivar DDL de Hibernate - los scripts SQL crearán el schema
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Manejo de LOBs (CLOB/BLOB)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Batch fetch
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# ===============================
# INICIALIZACIÓN DE SCRIPTS
# ===============================
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Rutas de scripts
spring.sql.init.schema-locations=classpath:scripts/schema.sql
spring.sql.init.data-locations=classpath:scripts/test-data.sql

# ===============================
# TEST DATABASE
# ===============================
spring.test.database.replace=NONE

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=false
